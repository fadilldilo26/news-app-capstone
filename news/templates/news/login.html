{% extends "news/base.html" %}

{% block title %}Login - NewsApp{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center;">
    <h1 style="margin-bottom: 1.5rem;">Login</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 1rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Username:</label>
            <input type="text" name="username" required 
                   style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Password:</label>
            <input type="password" name="password" required 
                   style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center;">
        Don't have an account? 
        <!-- FIXED: Hardcoded path -->
        <a href="/register/" style="color: #d4af37; font-weight: bold;">Register here</a>
    </p>
</div>
{% endblock %}
