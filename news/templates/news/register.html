{% extends "news/base.html" %}
    {% block content %}
    <div style="max-width: 400px; margin: 50px auto; padding: 20px; background: #f9f9f9; border-radius: 8px;">
        <h2>Register</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background: #d4af37; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Register</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">Already have an account? <a href="{% url 'custom-login' %}">Login here</a></p>
    </div>
    {% endblock %}
